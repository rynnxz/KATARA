name: CI Security & Release Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

# Prinsip Least Privilege: default izin hanya baca repositori
permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Static Analysis, Security Audit & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify read-only konten/ directory integrity
        run: |
          if [ -n "$(git status --porcelain konten/)" ]; then
            echo "ERROR: konten/ directory must remain untouched!"
            exit 1
          fi

      - name: Run Flutter Analyze (strict)
        run: flutter analyze --no-pub

      - name: Run Full Automated Test Suite (Unit, Contrast, Security, Migrations)
        run: flutter test --no-pub

  build_release_apk:
    name: Build Obfuscated Release APK & SBOM
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Obfuscated Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Generate SHA-256 Checksums & Dependency Manifest (SBOM)
        run: |
          mkdir -p dist/ci_artifacts
          cp build/app/outputs/flutter-apk/app-release.apk dist/ci_artifacts/katara-release.apk
          cp dist/releases/v1.1.1/module_langkat.zip dist/ci_artifacts/
          cp dist/releases/v1.1.1/module_palembang.zip dist/ci_artifacts/
          cp dist/releases/v1.1.1/module_catalog.json dist/ci_artifacts/
          flutter pub deps --json > dist/ci_artifacts/sbom-pub-deps.json
          cd dist/ci_artifacts
          sha256sum katara-release.apk module_langkat.zip module_palembang.zip module_catalog.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts & Checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: katara-release-bundle
          path: dist/ci_artifacts/
          if-no-files-found: error
